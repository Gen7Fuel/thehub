x-cdn-origin: &cdn-origin ${HUB_CDN_UPSTREAM:-https://gen7erp-cdn-prod-29b24248.azurewebsites.net}

services:
  mongo:
    extends:
      file: compose.yaml
      service: mongo
    container_name: !reset null
    networks: !reset null
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 4s
      retries: 15
    volumes:
      - type: bind
        source: ${GEN7_DATA_ROOT:?set GEN7_DATA_ROOT}/hub/mongo
        target: /data/db
        bind:
          create_host_path: false

  redis:
    extends:
      file: compose.yaml
      service: redis
    container_name: !reset null
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - type: bind
        source: ${GEN7_DATA_ROOT:?set GEN7_DATA_ROOT}/hub/redis
        target: /data
        bind:
          create_host_path: false

  postgres:
    extends:
      file: compose.yaml
      service: postgres
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${GEN7_DATA_ROOT:?set GEN7_DATA_ROOT}/hub/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  backend:
    extends:
      file: compose.yaml
      service: backend
    container_name: !reset null
    restart: unless-stopped
    environment: &vm-upstreams
      CDN_SERVICE_URL: *cdn-origin
      UPLOAD_SERVICE_URL: *cdn-origin
      EMAIL_SERVICE_URL: http://email-service:2525
    depends_on: &data-ready
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Private SMTP relay. The worker is the only caller that sends mail. No host port is
  # published and the image is pinned by digest here, so a relay change is a reviewed
  # configuration change staged separately from app image releases. The deployer uses
  # --no-deps, so start this service with the cutover procedure, not a release.
  email-service:
    image: ghcr.io/gen7fuel/thehub-email-service@sha256:44faa003a368e7eeac603d94d09d8ca77380d0d35c380c4be18fef58f62cae2a
    restart: unless-stopped
    environment:
      EMAIL_SERVICE_API_KEY: ${EMAIL_SERVICE_API_KEY:?set EMAIL_SERVICE_API_KEY}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:?set SMTP_SECURE}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
    volumes:
      # Idempotency journal: keeps blocked and sent keys across container replacement.
      - email-relay-state:/var/lib/email-relay
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Exactly one worker owns email sends. Job retries stay off until the relay has
  # duplicate protection (emailQueue sets no attempts, so BullMQ makes one attempt).
  worker:
    extends:
      file: compose.yaml
      service: worker
    container_name: !reset null
    restart: unless-stopped
    environment: *vm-upstreams
    depends_on:
      <<: *data-ready
      email-service:
        condition: service_healthy

  scheduler:
    extends:
      file: compose.yaml
      service: scheduler
    container_name: !reset null
    restart: unless-stopped
    environment: *vm-upstreams
    depends_on: *data-ready

  auth-backend:
    extends:
      file: compose.yaml
      service: auth-backend
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes: !reset []

  frontend:
    image: ${HUB_FRONTEND_IMAGE:?set HUB_FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      HUB_API_UPSTREAM: backend:5000
      HUB_AUTH_UPSTREAM: auth-backend:5005
      HUB_CDN_UPSTREAM: *cdn-origin
    ports:
      - "127.0.0.1:${HUB_VM_HTTP_PORT:-3000}:8080"
    volumes:
      - type: bind
        source: ./infra/vm/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false

volumes:
  email-relay-state:
