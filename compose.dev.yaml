services:
  mongo:
    container_name: mongo
    image: mongo:8
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: always
  redis:
    container_name: redis
    image: redis:7
    restart: always

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - UPLOAD_SERVICE_URL=http://cdn:5001
      - REDIS_URL=redis://redis:6379
      - FORCE_COLOR=1
    depends_on:
      - mongo
      - redis
      - postgres
    restart: always

  auth-backend:
    container_name: auth-backend
    build:
      context: ./auth-backend
      dockerfile: Dockerfile.dev
    ports:
      - "5005:5005"
    volumes:
      - ./auth-backend:/app
      - auth-backend_node_modules:/app/node_modules
      - ./backend/models:/app/models
      - ./backend/utils/attachSiteAlias.js:/app/utils/attachSiteAlias.js
    env_file:
      - ./auth-backend/.env
    environment:
      - UPLOAD_SERVICE_URL=http://cdn:5001
      - FORCE_COLOR=1
    depends_on:
      - mongo
    restart: always

  cdn:
    container_name: cdn
    build: ./cdn
    volumes:
      - uploads:/app/uploads
      - cdn_migration_state:/migration/state
    ports:
      - "5001:5001"
    environment:
      - CDN_ADMIN_TOKEN=${CDN_ADMIN_TOKEN:-}
      - CDN_STORAGE=${CDN_STORAGE:-local}
      - CDN_MIGRATION_STATE_DIR=/migration/state
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_CONTAINER=${AZURE_CONTAINER:-}
    stop_grace_period: 60s
    depends_on:
      - mongo
    restart: always

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_DOCKER=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
      - cdn
    restart: on-failure:3

volumes:
  dist:
  uploads:
  cdn_migration_state:
  mongodb_data:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  auth-backend_node_modules:
