name: Test SSH Connection

on:
  workflow_dispatch:  # allows manual trigger in GitHub Actions
    inputs:
      backfill_payouts:
        description: Backfill Sioux Valley payouts from October 1, 2026 through today
        type: boolean
        default: false
      apply:
        description: Write and verify corrections (otherwise dry run)
        type: boolean
        default: false

jobs:
  test-ssh:
    if: ${{ !inputs.backfill_payouts }}
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "SSH connection successful!"
            whoami
            pwd

  backfill-payouts:
    if: ${{ inputs.backfill_payouts }}
    runs-on: ubuntu-latest
    concurrency: sioux-valley-payout-backfill
    steps:
      - uses: actions/checkout@v4
      - name: Prepare payout backfill
        run: |
          mkdir -p payout-backfill
          cp backend/manual/backfillSiouxValleyPayouts.js payout-backfill/
          cp backend/utils/parseSftReport.js backend/utils/payoutFormula.js payout-backfill/
      - name: Transfer payout backfill
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: payout-backfill
          target: /tmp/thehub-payout-backfill/${{ github.run_id }}
      - name: Run and verify payout backfill
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/gen7fuel/thehub
            container=$(docker compose ps -q backend)
            test -n "$container"
            task_dir=/app/.payout-backfill/${{ github.run_id }}
            docker exec "$container" mkdir -p "$task_dir/manual" "$task_dir/utils" "$task_dir/models"
            docker cp /tmp/thehub-payout-backfill/${{ github.run_id }}/payout-backfill/backfillSiouxValleyPayouts.js "$container:$task_dir/manual/"
            docker cp /tmp/thehub-payout-backfill/${{ github.run_id }}/payout-backfill/parseSftReport.js "$container:$task_dir/utils/"
            docker cp /tmp/thehub-payout-backfill/${{ github.run_id }}/payout-backfill/payoutFormula.js "$container:$task_dir/utils/"
            docker exec "$container" sh -c 'cp /app/models/CashSummaryNew.js /app/models/Location.js "$1/models/"; cp /app/utils/attachSiteAlias.js "$1/utils/"' sh "$task_dir"
            docker exec "$container" node "$task_dir/manual/backfillSiouxValleyPayouts.js" ${{ inputs.apply && '--apply' || '' }}
