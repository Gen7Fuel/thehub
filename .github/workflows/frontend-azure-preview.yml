name: Preview frontend on Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-azure-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.FRONTEND_AZURE_PREVIEW_ENABLED == 'true'
    environment: frontend-production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_FRONTEND_CLIENT_ID }}
          tenant-id: 21634e14-74fa-410a-8886-4c3f808b58cb
          subscription-id: 29b24248-1990-4592-b25d-e6ee8e9db784
      - name: Verify this host is still configured for preview
        run: |
          mode=$(az webapp config appsettings list --resource-group Gen7ERP --name gen7erp-frontend-prod-29b24248 --query "[?name=='HUB_FRONTEND_ROUTING_MODE'].value | [0]" --output tsv)
          test "$mode" = preview
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to the frontend registry without admin credentials
        run: az acr login --name gen7erpfrontend29b24248
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.azure
          load: true
          tags: hub-frontend-azure:local
          build-args: RELEASE_COMMIT=${{ github.sha }}
      - name: Rehearse the exact image before publishing
        run: python infra/azure/frontend/rehearse.py
      - name: Publish an immutable release
        id: image
        run: |
          image="gen7erpfrontend29b24248.azurecr.io/hub-frontend:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker tag hub-frontend-azure:local "$image"
          docker push "$image"
          digest=$(az acr repository show --name gen7erpfrontend29b24248 --image "hub-frontend:${GITHUB_SHA}-${GITHUB_RUN_ID}" --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=gen7erpfrontend29b24248.azurecr.io/hub-frontend@$digest" >> "$GITHUB_OUTPUT"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: gen7erp-frontend-prod-29b24248
          images: ${{ steps.image.outputs.digest }}
      - name: Verify the Azure preview and proxied health routes
        env:
          FRONTEND_EXPECT_COMMIT: ${{ github.sha }}
        run: |
          hostname=$(az webapp show --resource-group Gen7ERP --name gen7erp-frontend-prod-29b24248 --query defaultHostName --output tsv)
          export FRONTEND_URL="https://${hostname}"
          node infra/azure/frontend/verify-preview.mjs
