name: Publish Hub email relay image

on:
  push:
    branches: [main]
    paths:
      - 'email-service/**'
      - '.github/workflows/email-service-image.yml'
  pull_request:
    paths:
      - 'email-service/**'
      - '.github/workflows/email-service-image.yml'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the relay tests
        run: docker run --rm -v "$PWD/email-service:/src:ro" oven/bun:1 sh -c 'cp -r /src /work && cd /work && bun install --frozen-lockfile && bun test'

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: email-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the email relay
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ./email-service
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gen7fuel/thehub-email-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=thehub-email-service
          cache-to: type=gha,mode=max,scope=thehub-email-service
      - name: Record the pinned image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ghcr.io/gen7fuel/thehub-email-service@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
